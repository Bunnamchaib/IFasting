<script id="domain">
'use strict';
// Domain: pure functions. Independent of DOM, storage and network.
globalThis.IFCore=(()=>{
 const finite=(v,min,max)=>typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;
 const iso=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}T/.test(v)&&Number.isFinite(Date.parse(v));
 const time=v=>typeof v==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v);
 function empty(){return {app:'iFasting',schemaVersion:1,revision:0,onboarded:false,consentVersion:0,profile:null,activeFast:null,activeSleep:null,fasts:[],water:[],weights:[],sleeps:[],settings:{theme:'dark',language:null},checkins:{}};}
 function validAvatar(v){return v==null||(typeof v==='string'&&v.length>100&&v.length<=20000&&(v.length-23)%4===0&&/^data:image\/jpeg;base64,\/9j\/[A-Za-z0-9+/]+={0,2}$/.test(v));}
 function validProfile(p){return !!p&&typeof p.name==='string'&&p.name.length<=60&&validAvatar(p.avatar)&&finite(p.weight,20,400)&&finite(p.height,80,250)&&finite(p.targetWeight,20,400)&&finite(p.waterGoal,250,6000)&&finite(p.sleepGoal,3,14)&&['female','male','unspecified'].includes(p.sex)&&[p.morning,p.morningEnd,p.bedtime,p.bedtimeEnd].every(time);}
 function dayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
 function elapsed(start,now=Date.now()){return Math.max(0,now-Date.parse(start));}
 function waterTotal(rows,key=dayKey()){return rows.filter(r=>dayKey(new Date(r.at))===key).reduce((sum,r)=>sum+r.ml,0);}
 function sleepHours(start,end){if(!iso(start)||!iso(end)||Date.parse(end)<=Date.parse(start))throw Error('เวลาตื่นต้องอยู่หลังเวลาเข้านอน');return (Date.parse(end)-Date.parse(start))/3600000;}
 function inWindow(now,start,end){return start<=end?now>=start&&now<=end:now>=start||now<=end;}
 function validateBackup(input){
  const fail=()=>{throw Error('ไฟล์สำรองไม่ถูกต้อง หรือเป็นข้อมูลรุ่นที่แอปนี้ยังไม่รองรับ');};
  if(!input||input.app!=='iFasting'||input.schemaVersion!==1||typeof input.onboarded!=='boolean'||(input.profile!==null&&!validProfile(input.profile))||(input.onboarded&&!validProfile(input.profile))||!Number.isInteger(input.consentVersion)||input.consentVersion<0)fail();
  const out=empty();out.onboarded=input.onboarded;out.consentVersion=input.consentVersion;out.profile=input.profile?{name:input.profile.name,sex:input.profile.sex,avatar:input.profile.avatar??null,...Object.fromEntries(['weight','height','targetWeight','waterGoal','sleepGoal','morning','morningEnd','bedtime','bedtimeEnd'].map(k=>[k,input.profile[k]]))}:null;
  for(const kind of ['fasts','water','weights','sleeps']){
   if(!Array.isArray(input[kind])||input[kind].length>100000)fail();const ids=new Set();
   out[kind]=input[kind].map(r=>{
    if(!r||typeof r.id!=='string'||!r.id||r.id.length>100||ids.has(r.id)||!iso(r.updatedAt))fail();ids.add(r.id);
    if(kind==='water'||kind==='weights'){
     if(!iso(r.at)||!finite(kind==='water'?r.ml:r.kg,kind==='water'?1:20,kind==='water'?3000:400))fail();
     return {id:r.id,at:r.at,updatedAt:r.updatedAt,[kind==='water'?'ml':'kg']:kind==='water'?r.ml:r.kg};
    }
    if(!iso(r.start)||!iso(r.end)||Date.parse(r.end)<=Date.parse(r.start))fail();
    return {id:r.id,start:r.start,end:r.end,updatedAt:r.updatedAt};
   });
  }
  for(const k of ['activeFast','activeSleep']){const r=input[k];if(r!==null&&(!r||typeof r.id!=='string'||!r.id||r.id.length>100||!iso(r.start)))fail();out[k]=r?{id:r.id,start:r.start}:null;}
  if(!input.settings||!['dark','light','system'].includes(input.settings.theme)||(input.settings.language!=null&&!['th','en'].includes(input.settings.language)))fail();out.settings={theme:input.settings.theme,language:input.settings.language??null};
  if(!input.checkins||typeof input.checkins!=='object'||Array.isArray(input.checkins))fail();
  out.checkins=Object.fromEntries(Object.entries(input.checkins).filter(([k,v])=>/^(wake|bed)-\d{4}-\d{2}-\d{2}$/.test(k)&&iso(v)));
  out.revision=Number.isSafeInteger(input.revision)&&input.revision>=0?input.revision:0;
  return out;
 }
 function merge(a,b){const out=validateBackup(JSON.parse(JSON.stringify(a)));const other=validateBackup(JSON.parse(JSON.stringify(b)));
  for(const k of ['fasts','water','weights','sleeps']){const map=new Map(out[k].map(r=>[r.id,r]));for(const r of other[k])if(!map.has(r.id)||Date.parse(r.updatedAt)>Date.parse(map.get(r.id).updatedAt))map.set(r.id,r);out[k]=[...map.values()];}
  if(!out.profile){out.profile=other.profile;out.onboarded=other.onboarded;out.consentVersion=other.consentVersion;}
  out.activeFast=out.activeFast||other.activeFast;out.activeSleep=out.activeSleep||other.activeSleep;
  if(out.activeFast&&out.fasts.some(r=>r.id===out.activeFast.id))out.activeFast=null;
  if(out.activeSleep&&out.sleeps.some(r=>r.id===out.activeSleep.id))out.activeSleep=null;
  return out;
 }
 function transition(current,fn){const revision=current.revision;fn(current);const next=validateBackup(current);next.revision=revision+1;return next;}
 function assertUnchanged(rows,id,updatedAt){const r=rows.find(x=>x.id===id);if(!r||r.updatedAt!==updatedAt)throw Error('รายการนี้เปลี่ยนจากอีกหน้าต่างแล้ว กรุณาปิดแล้วเปิดรายการใหม่');return r;}
 function currentWeight(s){return [...s.weights].sort((a,b)=>Date.parse(b.at)-Date.parse(a.at))[0]?.kg||s.profile?.weight||70;}
 function updateProfile(s,p,initialWeight,meta){if(!validProfile(p))throw Error('ข้อมูลโปรไฟล์ไม่ถูกต้อง');const next={...p};if(p.weight!==initialWeight)s.weights.push({id:meta.id,kg:p.weight,at:meta.at,updatedAt:meta.at});else next.weight=currentWeight(s);s.profile=next;}
 return {empty,validProfile,validAvatar,dayKey,elapsed,waterTotal,sleepHours,validateBackup,merge,inWindow,transition,assertUnchanged,currentWeight,updateProfile};
})();
</script>

 // Storage adapter: one atomic, versioned document. All writes go through a queue and re-read current data.
 const Storage={
  open(){return new Promise((resolve,reject)=>{const req=indexedDB.open('ifasting-local',2);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('documents'))req.result.createObjectStore('documents');};req.onsuccess=()=>{db=req.result;db.onversionchange=()=>{db.close();storageProblem=true;$('#statusBanner').innerHTML=t("<div class=\"notice error\">แอปมีการอัปเดตฐานข้อมูล กรุณาโหลดหน้านี้ใหม่ก่อนบันทึก</div>");};resolve();};req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error(t("กรุณาปิด iFasting ในแท็บอื่นแล้วลองใหม่")));});},
  read(){return new Promise((resolve,reject)=>{const tx=db.transaction('documents','readonly');const r=tx.objectStore('documents').get('state');r.onsuccess=()=>{try{resolve(r.result?C.validateBackup(r.result):C.empty());}catch(e){reject(e);}};r.onerror=()=>reject(r.error);});},
  mutate(fn){return new Promise((resolve,reject)=>{const tx=db.transaction('documents','readwrite');const store=tx.objectStore('documents');const req=store.get('state');let next,problem;
   req.onsuccess=()=>{try{const current=req.result?C.validateBackup(req.result):C.empty();next=C.transition(current,fn);store.put(next,'state');}catch(e){problem=e;tx.abort();}};
   tx.oncomplete=()=>resolve(next);tx.onabort=()=>reject(problem||tx.error||Error(t("บันทึกข้อมูลไม่สำเร็จ")));tx.onerror=()=>{};
  });}
 };
 let queue=Promise.resolve();

 function fail(e){const message=t(e?.message||t("เกิดข้อผิดพลาด กรุณาลองใหม่"));if(modal.open){let alert=modal.querySelector('[data-form-error]');if(!alert){alert=document.createElement('p');alert.className='notice error';alert.setAttribute('role','alert');alert.setAttribute('data-form-error','');modal.querySelector('.dialog-head').after(alert);}alert.textContent=message;alert.scrollIntoView({block:'nearest'});}else toast(message);}

 function water(){const total=C.waterTotal(state.water),goal=state.profile.waterGoal;return `${heading('HYDRATION',t("เติมน้ำ เติมความสดชื่น"),t("ปริมาณเล็ก ๆ ในแต่ละครั้ง รวมเป็นการดูแลตัวเองตลอดวัน"))}<div class="grid2 water-page"><section class="card center"><div class="row between"><span class="eyebrow">TODAY’S WATER</span><span class="tag blue">${Math.round(total/goal*100)}${t("% ของเป้าหมาย")}</span></div>${glass(total/goal*100,true)}<div class="water-stat num">${total.toLocaleString()} <span>/ ${goal.toLocaleString()} ml</span></div><div class="meter"><i style="width:${Math.min(100,total/goal*100)}%"></i></div><small>${total>=goal?t("ครบเป้าหมายแล้ว ไม่จำเป็นต้องฝืนดื่มเพิ่ม"):`${t("ยังเหลือ ")}${(goal-total).toLocaleString()} ml`}</small><div style="margin-top:24px;border-top:1px solid var(--line);padding-top:18px"><div class="amount num blue"><output id="amountOutput">${waterAmount}</output> <small>ml</small></div><label class="muted" for="waterSlider">${t("เลื่อนเลือกปริมาณที่ดื่ม")}</label><input class="slider" id="waterSlider" type="range" min="50" max="1000" step="25" value="${waterAmount}"><div class="row between"><small>50 ml</small><small>1,000 ml</small></div><div class="chips" style="justify-content:center;margin:16px 0">${[150,250,400,500].map(v=>`<button class="chip ${waterAmount===v?'selected':''}" data-amount="${v}">${v}</button>`).join('')}</div>${btn(t("บันทึกน้ำ ")+waterAmount+' ml','add-water','plus','full')}<button class="textbtn" style="margin-top:12px" data-action="water-form">${t("เลือกเวลา / ปริมาณอื่น")}</button></div></section><div class="stack"><section class="card"><h3>${t("แต่ละแก้วของวันนี้")}</h3>${history('water',true)}</section><section class="card"><h3>${t("น้ำดื่มย้อนหลัง 7 วัน")}</h3>${dailyChart('water')}<p class="card-note">${t("เป้าหมายปรับได้ในตั้งค่า · ไม่ต้องฝืนดื่มให้เกินความต้องการ")}</p></section></div><section class="card fullspan"><h3>${t("ประวัติน้ำดื่มทั้งหมด")}</h3>${history('water')}</section></div>`;}
 function sleep(){return `${heading('REST & RESET',t("คืนนี้ พักให้เต็มที่"),t("บันทึกช่วงเวลาพักผ่อนง่าย ๆ ด้วยการแตะเพียงครั้งเดียว"))}${checkinCard()}<div class="grid2 sleep-page"><section class="card center"><div class="row between"><span class="eyebrow">YOUR PEACEFUL NIGHT</span><span class="tag purple">${t("เป้าหมาย ")}${state.profile.sleepGoal}${t(" ชม.")}</span></div><div class="sleep-orb float">${icon('sleep')}</div><h2>${state.activeSleep?t("อยู่ในช่วงพักผ่อน"):t("วางวันนี้ไว้ แล้วพักสักหน่อย")}</h2><p class="muted" style="margin:12px 0 24px">${state.activeSleep?t("เริ่ม ")+dateText(state.activeSleep.start)+' · '+timeText(state.activeSleep.start):t("กดก่อนนอน แล้วกลับมากดยืนยันเมื่อตื่น")}</p>${state.activeSleep?'<div class="amount num purple" data-live-sleep></div>':''}${btn(state.activeSleep?t("ตื่นแล้ว"):t("เข้านอนแล้ว"),state.activeSleep?'wake':'bed',state.activeSleep?'sun':'sleep','full primary')}<button class="textbtn" style="margin-top:16px" data-action="sleep-form">${t("ลืมบันทึก? เพิ่มเวลาย้อนหลัง")}</button><p class="card-note">${t("บันทึกช่วงพักผ่อนจากเวลาที่คุณยืนยัน")}<br>${t("ไม่ใช่การตรวจวัดเวลาหลับจริง")}</p></section><div class="stack"><section class="card"><h3>${t("การพักผ่อนย้อนหลัง 7 วัน")}</h3>${dailyChart('sleeps')}</section><section class="card"><h3>${t("ประวัติการพักผ่อน")}</h3>${history('sleeps')}</section></div></div>`;}
 function progress(){const weights=[...state.weights].sort((a,b)=>Date.parse(a.at)-Date.parse(b.at));const recent=weights.filter(r=>Date.parse(r.at)>=Date.now()-period*86400000);const last=weights.at(-1),first=weights[0];const change=first&&last?last.kg-first.kg:0;const bmi=(last?.kg||state.profile.weight)/(state.profile.height/100)**2;return `${heading('SMALL STEPS, REAL PROGRESS',t("มองเห็นทุกก้าวของคุณ"),t("ความสม่ำเสมอสำคัญกว่าตัวเลขในวันเดียว"))}<div class="row between" style="margin-bottom:20px"><div class="chips">${[7,14,30,90].map(d=>`<button class="chip ${period===d?'selected':''}" data-period="${d}">${d}${t(" วัน")}</button>`).join('')}</div>${btn(t("น้ำหนัก"),'weight-form','plus','secondary')}</div><div class="stat-grid"><div class="card"><small>${t("น้ำหนักล่าสุด")}</small><p class="num orange">${(last?.kg||state.profile.weight).toFixed(1)} <small>kg</small></p></div><div class="card"><small>${t("เปลี่ยนจากครั้งแรก")}</small><p class="num">${change>0?'+':''}${change.toFixed(1)} <small>kg</small></p></div><div class="card"><small>${t("BMI โดยประมาณ")}</small><p class="num">${bmi.toFixed(1)}</p></div></div><section class="card" style="margin-top:20px"><div class="section-label"><h3>${t("แนวโน้มน้ำหนัก")}</h3><small>${t("เป้าหมาย ")}${state.profile.targetWeight} kg</small></div>${weightChart(recent)}<p class="card-note">${t("BMI เป็นข้อมูลคัดกรองเบื้องต้น ไม่ได้วัดองค์ประกอบร่างกาย")}</p></section><div class="below-grid"><section class="card"><h3>${t("สถิติ ")}${period}${t(" วันที่ผ่านมา")}</h3>${summaryRows()}</section><section class="card"><h3>${t("บันทึกน้ำหนัก")}</h3>${history('weights')}</section></div>`;}
 function summaryRows(){const since=Date.now()-period*86400000;const fasts=state.fasts.filter(r=>Date.parse(r.end)>=since),sleeps=state.sleeps.filter(r=>Date.parse(r.end)>=since);const water=state.water.filter(r=>Date.parse(r.at)>=since);return [[t("รอบฟาสติ้ง"),fasts.length+t(" รอบ")],[t("เฉลี่ยฟาสติ้ง"),fasts.length?(fasts.reduce((s,r)=>s+(Date.parse(r.end)-Date.parse(r.start))/3600000,0)/fasts.length).toFixed(1)+t(" ชม."):'—'],[t("น้ำดื่มที่บันทึก"),(water.reduce((s,r)=>s+r.ml,0)/1000).toFixed(2)+t(" ลิตร")],[t("พักผ่อนเฉลี่ย"),sleeps.length?(sleeps.reduce((s,r)=>s+C.sleepHours(r.start,r.end),0)/sleeps.length).toFixed(1)+t(" ชม."):'—']].map(([a,b])=>`<div class="history-row"><small>${a}</small><span>${b}</span></div>`).join('');}
 function history(kind,today=false){let rows=[...state[kind]].filter(r=>!today||C.dayKey(new Date(r.at))===C.dayKey()).sort((a,b)=>Date.parse(b.at||b.end)-Date.parse(a.at||a.end));if(!rows.length)return empty(t("ยังไม่มีบันทึก เริ่มจากครั้งแรกของคุณได้เลย"),kind==='water'?'water':kind==='sleeps'?'sleep':'chart');const shown=rows.slice(0,30);return `<div class="history">${shown.map(r=>`<div class="history-row"><div><p class="label">${kind==='water'?r.ml+' ml':kind==='weights'?r.kg.toFixed(1)+' kg':duration(r.start,r.end)}</p><small>${kind==='water'||kind==='weights'?dateText(r.at)+' · '+timeText(r.at):dateText(r.start)+' '+timeText(r.start)+' → '+dateText(r.end)+' '+timeText(r.end)}</small></div><button class="iconbtn" data-edit="${kind}" data-id="${esc(r.id)}" aria-label="${t("แก้ไขรายการ ")}${esc(r.id)}">${icon('edit')}</button></div>`).join('')}</div>${rows.length>30?t("<p class=\"card-note\">แสดง 30 รายการล่าสุด · ไฟล์สำรองมีข้อมูลทั้งหมด</p>"):''}`;}
 function dailyChart(kind){const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d;});const values=days.map(d=>kind==='water'?C.waterTotal(state.water,C.dayKey(d)):state.sleeps.filter(r=>C.dayKey(new Date(r.end))===C.dayKey(d)).reduce((s,r)=>s+C.sleepHours(r.start,r.end),0));const max=Math.max(kind==='water'?state.profile.waterGoal:state.profile.sleepGoal,...values,1),color=kind==='water'?'var(--blue)':'var(--purple)';return `<svg class="chart" viewBox="0 0 350 170" role="img" aria-label="${esc(days.map((d,i)=>d.getDate()+': '+values[i].toFixed(0)+(kind==='water'?' ml':t(" ชม."))).join(', '))}"><line x1="10" y1="140" x2="340" y2="140" stroke="var(--line)"/>${values.map((v,i)=>{const h=v/max*95;return `<rect x="${19+i*47}" y="${140-Math.max(2,h)}" width="24" height="${Math.max(2,h)}" rx="5" fill="${color}" opacity="${v?.8:.12}"/><text x="${31+i*47}" y="${130-h}" text-anchor="middle">${v?(kind==='water'?Math.round(v):v.toFixed(1)):''}</text><text x="${31+i*47}" y="162" text-anchor="middle">${days[i].getDate()}/${days[i].getMonth()+1}</text>`;}).join('')}</svg>`;}
 function weightChart(rows){if(!rows.length)return empty(t("ยังไม่มีน้ำหนักในช่วงนี้ ลองบันทึกน้ำหนักครั้งแรก"));const min=Math.min(...rows.map(r=>r.kg))-1,max=Math.max(...rows.map(r=>r.kg))+1;const start=Date.parse(rows[0].at),end=Date.parse(rows.at(-1).at);const point=r=>[rows.length===1?175:32+(Date.parse(r.at)-start)/Math.max(1,end-start)*286,130-(r.kg-min)/(max-min)*100];const coords=rows.map(point);return `<svg class="chart" viewBox="0 0 350 170" role="img" aria-label="${t("น้ำหนัก ")}${rows.map(r=>esc(dateText(r.at)+' '+r.kg+' kg')).join(', ')}"><line x1="28" y1="140" x2="330" y2="140" stroke="var(--line)"/><polyline points="${coords.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linejoin="round"/>${coords.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="4" fill="var(--orange)"/><title>${esc(rows[i].kg+' kg')}</title>`).join('')}<text x="30" y="16">${max.toFixed(1)} kg</text><text x="30" y="159">${dateText(rows[0].at)}</text><text x="320" y="159" text-anchor="end">${dateText(rows.at(-1).at)}</text></svg>`;}
 function settings(){return `${heading('MAKE IT YOURS',t("พื้นที่ของคุณ"),t("ปรับเป้าหมาย จัดการข้อมูล และชวนเพื่อนเริ่มดูแลตัวเอง"))}<div class="grid2"><section class="card"><span class="eyebrow">PROFILE & GOALS</span><div class="settings-list"><div class="setting-row">${icon('weight')}<div><h3>${esc(state.profile.name||t("ข้อมูลส่วนตัวและเป้าหมาย"))}</h3><p>${state.profile.height}${t(" cm · เป้าหมาย ")}${state.profile.targetWeight}${t(" kg · น้ำ ")}${state.profile.waterGoal} ml</p></div><button class="textbtn" data-action="profile">${t("แก้ไข")}</button></div><div class="setting-row">${icon('sleep')}<div><h3>Smart Sleep Check-in</h3><p>${t("เช้า ")}${state.profile.morning}–${state.profile.morningEnd}<br>${t("ก่อนนอน ")}${state.profile.bedtime}–${state.profile.bedtimeEnd}</p></div><button class="textbtn" data-action="profile">${t("ตั้งค่า")}</button></div><div class="setting-row">${icon('sun')}<div><h3>${t("ภาษา / Language")}</h3><p>${t("เลือกภาษาที่ใช้ในแอป")}</p></div><div class="chips"><button class="chip ${state.settings.language==='th'?'selected':''}" data-action="choose-th">TH</button><button class="chip ${state.settings.language==='en'?'selected':''}" data-action="choose-en">EN</button></div></div><div class="setting-row">${icon('sun')}<div><h3>${t("บรรยากาศที่ชอบ")}</h3><p>${t("เลือกธีมให้สบายตา")}</p></div></div><div class="segmented" style="margin-bottom:20px">${[['dark',t("กลางคืน")],['light',t("กลางวัน")],['system',t("ตามเครื่อง")]].map(([v,l])=>`<button class="chip ${state.settings.theme===v?'selected':''}" data-theme-choice="${v}">${l}</button>`).join('')}</div></div><div class="notice">${t("ข้อมูลสุขภาพเก็บในเบราว์เซอร์นี้ ไม่มีบัญชีหรือการซิงก์อัตโนมัติ การล้างข้อมูลเว็บไซต์อาจทำให้ข้อมูลหาย ควรส่งออกไฟล์สำรองเป็นระยะ")}</div></section><section class="card"><span class="eyebrow">YOUR DATA, YOUR CHOICE</span>${[['down',t("ส่งออกข้อมูล"),t("เก็บไฟล์ JSON สำรองหรือย้ายเครื่อง"),'export',t("ส่งออก")],['down',t("นำเข้าข้อมูล"),t("ตรวจไฟล์และเลือกรวม / แท  function profileFields(p=state.profile){if(p){const latest=[...state.weights].sort((a,b)=>Date.parse(b.at)-Date.parse(a.at))[0];p={...p,weight:latest?.kg||p.weight};}p=p||{name:'',sex:'unspecified',weight:70,height:170,targetWeight:65,waterGoal:2100,sleepGoal:8,morning:'05:00',morningEnd:'07:00',bedtime:'20:00',bedtimeEnd:'02:00'};return `<div class="form-grid">${photoFields(p)}${field(t("ชื่อเล่น (ไม่บังคับ)"),'name','text',p.name,'maxlength="60" autocomplete="given-name"')}<label class="field">${t("เพศ")}<select name="sex">${[['unspecified',t("ไม่ระบุ")],['female',t("หญิง")],['male',t("ชาย")]].map(([v,l])=>`<option value="${v}" ${p.sex===v?'selected':''}>${l}</option>`).join('')}</select></label>${field(t("น้ำหนักปัจจุบัน (kg)"),'weight','number',p.weight,'required min="20" max="400" step="0.1" inputmode="decimal"')}${field(t("ส่วนสูง (cm)"),'height','number',p.height,'required min="80" max="250" step="0.1" inputmode="decimal"')}${field(t("น้ำหนักเป้าหมาย (kg)"),'targetWeight','number',p.targetWeight,'required min="20" max="400" step="0.1" inputmode="decimal"')}${field(t("เป้าหมายน้ำ (ml/วัน)"),'waterGoal','number',p.waterGoal,'required min="250" max="6000" step="50" inputmode="numeric"')}<div class="fullspan"><button type="button" class="textbtn" data-action="suggest-water">${t("ใช้ค่าตั้งต้นจากน้ำหนัก (30 ml/kg)")}</button><p class="card-note" style="margin-top:0">${t("ค่าคร่าว ๆ ปรับตามอาหาร อากาศ กิจกรรม และข้อจำกัดสุขภาพ ไม่จำเป็นต้องดื่มน้ำเปล่าตามสูตรทั้งหมด")}</p></div>${field(t("เป้าหมายพักผ่อน (ชั่วโมง)"),'sleepGoal','number',p.sleepGoal,'required min="3" max="14" step="0.5"')}<div></div><div class="fullspan"><small>${t("ถามเรื่องนอนเมื่อเปิดแอปในช่วงนี้ ปรับให้เหมาะกับตารางชีวิตได้")}</small></div>${field(t("ช่วงเช้า เริ่ม"),'morning','time',p.morning,'required')}${field(t("ช่วงเช้า สิ้นสุด"),'morningEnd','time',p.morningEnd,'required')}${field(t("ก่อนนอน เริ่ม"),'bedtime','time',p.bedtime,'required')}${field(t("ก่อนนอน สิ้นสุด"),'bedtimeEnd','time',p.bedtimeEnd,'required')}</div>`;}
 function readProfile(form){const f=new FormData(form),p={};for(const k of ['name','sex','morning','morningEnd','bedtime','bedtimeEnd'])p[k]=String(f.get(k)||'').trim();for(const k of ['weight','height','targetWeight','waterGoal','sleepGoal'])p[k]=Number(f.get(k));p.avatar=String(f.get('avatar')||'')||null;if(!C.validProfile(p))throw Error(t("กรุณาตรวจสอบข้อมูลร่างกายและเป้าหมาย"));return p;}
 function avatarMarkup(profile){return profile?.avatar?`<img src="${esc(profile.avatar)}" alt="">`:esc((profile?.name||'i').slice(0,1));}
 function photoFields(profile){return `<div class="profile-photo fullspan"><div class="photo-preview">${avatarMarkup(profile)}</div><div class="grow"><h3>${t("รูปโปรไฟล์")}</h3><div class="chips" style="margin-top:8px"><button type="button" class="chip" data-action="upload-avatar">${t("เลือกรูป")}</button><button type="button" class="textbtn" data-action="remove-avatar" ${profile?.avatar?'':'hidden'}>${t("ลบรูป")}</button></div><small class="photo-size">${profile?.avatar?`${t("รูปเล็กประมาณ ")}${Math.ceil(profile.avatar.length*.75/1024)} KB`:t("ย่อเป็น 128 × 128 px · เก็บในเครื่องและไฟล์สำรอง")}</small></div><input type="hidden" name="avatar" value="${esc(profile?.avatar||'')}"></div>`;}
 function updatePhotoPreview(form){const avatar=form.elements.avatar.value;form.querySelector('.photo-preview').innerHTML=avatarMarkup({avatar,name:form.elements.name?.value||state.profile?.name});form.querySelector('[data-action="remove-avatar"]').hidden=!avatar;form.querySelector('.photo-size').textContent=avatar?`${t('รูปเล็กประมาณ ')}${Math.ceil(avatar.length*.75/1024)} KB` :t('ย่อเป็น 128 × 128 px · เก็บในเครื่องและไฟล์สำรอง');}
 async function compressPhoto(file){
  if(file.size>10*1024*1024)throw Error(t("รูปใหญ่เกิน 10 MB กรุณาเลือกรูปที่เล็กลง"));
  if(!/^image\/(jpeg|png|webp|avif|heic|heif)$/i.test(file.type))throw Error(t("กรุณาเลือกรูป JPEG, PNG, WebP หรือรูปจากกล้องที่เบราว์เซอร์รองรับ"));
  const url=URL.createObjectURL(file),image=new Image();
  try{
   await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error(t("เปิดรูปนี้ไม่ได้ ลองใช้รูป JPEG หรือ PNG")));image.src=url;});
   if(!image.naturalWidth||image.naturalWidth*image.naturalHeight>40000000)throw Error(t("ความละเอียดรูปสูงเกินไป กรุณาเลือกรูปที่เล็กลง"));
   const canvas=document.createElement('canvas');canvas.width=canvas.height=128;const context=canvas.getContext('2d');if(!context)throw Error(t("เบราว์เซอร์นี้ยังย่อรูปไม่ได้"));context.fillStyle='#e9eee7';context.fillRect(0,0,128,128);const side=Math.min(image.naturalWidth,image.naturalHeight);context.drawImage(image,(image.naturalWidth-side)/2,(image.naturalHeight-side)/2,side,side,0,0,128,128);
   for(const quality of [.72,.6,.48,.35]){const result=canvas.toDataURL('image/jpeg',quality);if(C.validAvatar(result))return result;}
   throw Error(t("ย่อรูปให้เล็กพอไม่ได้ กรุณาเลือกรูปอื่น"));
  }finally{URL.revokeObjectURL(url);}
 }
 $('#avatarFile').addEventListener('change',async event=>{const file=event.target.files[0],form=avatarForm;if(!file||!form?.isConnected)return;const token=Symbol('photo');photoTasks.set(form,token);const buttons=[...form.querySelectorAll('[data-action="upload-avatar"],[data-action="remove-avatar"]')];buttons.forEach(b=>b.disabled=true);try{const avatar=await compressPhoto(file);if(photoTasks.get(form)===token&&form.isConnected&&form===avatarForm){form.elements.avatar.value=avatar;updatePhotoPreview(form);}}catch(error){if(photoTasks.get(form)===token&&form.isConnected&&form===avatarForm)fail(error);}finally{if(photoTasks.get(form)===token){photoTasks.delete(form);buttons.forEach(b=>b.disabled=false);}}});
 function checkinType(){if(!state.profile)return null;const d=new Date(),tm=localInput().slice(11),p=state.profile;const type=state.activeSleep&&C.inWindow(tm,p.morning,p.morningEnd)?'wake':!state.activeSleep&&C.inWindow(tm,p.bedtime,p.bedtimeEnd)?'bed':null;if(!type)return null;const key=type+'-'+C.dayKey(d);if(state.checkins[key])return null;return {type,key};}
 function checkinCard(){const c=checkinType();return c?`<section class="card checkin"><div class="row between"><div class="row purple">${icon(c.type==='wake'?'sun':'sleep')}<div><h3>${c.type==='wake'?t("นี่คือเวลาที่คุณตื่นใช่ไหม?"):t("กำลังจะพักผ่อนแล้วใช่ไหม?")}</h3><small>${t("ยืนยันเวลาได้ก่อนบันทึก")}</small></div></div><div class="chips"><button class="chip" data-action="${c.type}">${c.type==='wake'?t("ตื่นแล้ว"):t("เข้านอนแล้ว")}</button><button class="textbtn" data-action="snooze">${t("ไว้ทีหลัง")}</button></div></div></section>`:'';}
 function phaseIndex(){const h=state.activeFast?C.elapsed(state.activeFast.start)/3600000:0;return h<4?0:h<12?1:2;}
 function updateLive(){if(!booted||document.hidden)return;const ms=state.activeFast?C.elapsed(state.activeFast.start):0,h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,s=Math.floor(ms/1000)%60;document.querySelectorAll('[data-live-clock]').forEach(el=>el.innerHTML=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}<span class="seconds">:${String(s).padStart(2,'0')}</span>`);const frac=(ms/86400000)%1;document.querySelectorAll('[data-live-ring]').forEach(el=>el.setAttribute('stroke-dashoffset',String(760.27*(1-frac))));document.querySelectorAll('[data-live-dot]').forEach(el=>{el.setAttribute('cx',String(160+121*Math.sin(frac*2*Math.PI)));el.setAttribute('cy',String(160-121*Math.cos(frac*2*Math.PI)));el.style.opacity=state.activeFast?'1':'.25';});document.querySelectorAll('[data-live-phase]').forEach(el=>el.textContent=state.activeFast?[t("ช่วงหลังมื้ออาหาร"),t("ช่วงระหว่างมื้อ"),t("อดอาหารต่อเนื่อง")][phaseIndex()]:t("เริ่มเมื่อคุณพร้อม"));document.querySelectorAll('[data-live-days]').forEach(el=>el.textContent=h>=24?`${t("ผ่านแล้ว ")}${Math.floor(h/24)}${t(" วัน · รอบที่ ")}${Math.floor(h/24)+1}`:'');document.querySelectorAll('[data-live-sleep]').forEach(el=>el.textContent=state.activeSleep?duration(state.activeSleep.start,now()):'');}
 function showDialog(title,body){modal.innerHTML=`<div class="row between dialog-head"><h2>${title}</h2><button class="iconbtn" data-action="close-modal" aria-label="${t("ปิดหน้าต่าง")}">${icon('close')}</button></div>${body}`;if(!modal.open)modal.showModal();}
 const actions=()=>`<div class="form-actions"><button type="button" class="btn secondary" data-action="close-modal">${t("ยกเลิก")}</button><button type="submit" class="btn">${t("บันทึก")}</button></div>`;
 function showRecordForm(kind,recordId){const r=recordId?state[kind].find(x=>x.id===recordId):null;if(recordId&&!r)throw Error(t("รายการนี้ถูกเปลี่ยนแล้ว กรุณาลองใหม่"));const title={water:t("บันทึกน้ำดื่ม"),weights:t("บันทึกน้ำหนัก"),sleeps:t("บันทึกการพักผ่อน"),fasts:t("แก้ไขรอบฟาสติ้ง")}[kind];let fields;

  else{fields=field(t("เริ่ม / เข้านอน"),'start','datetime-local',localInput(r?.start||Date.now()-8*3600000),'required')+field(t("สิ้นสุด / ตื่นนอน"),'end','datetime-local',localInput(r?.end||Date.now()),'required');}

 function activeTimeForm(type){const wake=type==='wake',bed=type==='bed',active=wake?state.activeSleep:state.activeFast;if(wake&&!active)throw Error(t("ยังไม่มีเวลาเข้านอน เลือกบันทึกย้อนหลังได้ในหน้าการนอน"));showDialog(wake?t("ตื่นแล้ว ใช่ไหม?"):bed?t("พร้อมพักผ่อนแล้วใช่ไหม?"):t("เริ่มจังหวะของคุณ"),`<form id="activeForm" data-type="${type}" data-active-id="${esc(active?.id||'')}">${field(wake?t("เวลาตื่นนอน"):bed?t("เวลาเข้านอน"):t("เวลาเริ่มฟาสติ้ง"),'at','datetime-local',localInput(),'required')}<p class="card-note">${t("ปรับเวลาได้หากลืมบันทึกทันที")}${type==='start-fast'?t(" · ไม่บังคับเวลาสิ้นสุด"):''}</p>${actions()}</form>`);}
 async function addWater(ml,at=now()){const record={id:id(),ml,at,updatedAt:now()};await commit(s=>{s.water.push(record);});toast(`${t("เติมน้ำแล้ว ")}${ml} ml`,async()=>{await commit(s=>{const r=s.water.find(x=>x.id===record.id);if(r&&r.updatedAt===record.updatedAt)s.water=s.water.filter(x=>x.id!==record.id);else throw Error(t("รายการนี้เปลี่ยนแล้ว กรุณาแก้จากประวัติ"));});});}
 async function stopFast(){const active=state.activeFast;if(!active)throw Error(t("รอบนี้หยุดแล้ว"));const end=now();if(Date.parse(end)<=Date.parse(active.start))throw Error(t("เวลาในเครื่องก่อนเวลาเริ่ม กรุณาตรวจสอบนาฬิกา"));const record={...active,end,updatedAt:end};await commit(s=>{if(s.activeFast?.id!==active.id)throw Error(t("รอบฟาสติ้งเปลี่ยนแล้ว"));s.fasts.push(record);s.activeFast=null;});modal.close();toast(t("บันทึกรอบฟาสติ้งแล้ว"),async()=>{await commit(s=>{const r=s.fasts.find(x=>x.id===record.id);if(s.activeFast||!r||r.updatedAt!==record.updatedAt)throw Error(t("มีการเปลี่ยนแปลงแล้ว กรุณาแก้ไขจากประวัติ"));s.fasts=s.fasts.filter(x=>x.id!==record.id);s.activeFast=active;});});}

 async function share(){const u=new URL(location.href);if(!['https:','http:'].includes(u.protocol)||['localhost','127.0.0.1','::1','[::1]'].includes(u.hostname)){showDialog(t("แชร์เมื่อแอปมีลิงก์สาธารณะ"),`<p class="muted">${t("ตอนนี้เป็นตัวอย่างบนเครื่อง เมื่ออัปโหลด GitHub Pages แล้ว ปุ่มนี้จะแชร์ลิงก์แอปให้เพื่อนได้ ข้อมูลสุขภาพของคุณจะไม่ถูกแนบไปด้วย")}</p><div class="form-actions">${btn(t("เข้าใจแล้ว"),'close-modal')}</div>`);return;}const url=u.origin+u.pathname;
  if(navigator.share){try{await navigator.share({title:'iFasting',text:t("มาดูแลตัวเองทีละนิดด้วยกัน — Fasting น้ำดื่ม น้ำหนัก และการพักผ่อน"),url});return;}catch(e){if(e.name==='AbortError')return;}}

 async function install(){if(installEvent){await installEvent.prompt();installEvent=null;return;}showDialog(t("เพิ่ม iFasting บนมือถือ"),`<div class="install-hint"><p><strong>iPhone / iPad</strong><br>${t("เปิดลิงก์ด้วย Safari → ปุ่มแชร์ → เพิ่มไปยังหน้าจอโฮม")}</p><p style="margin-top:16px"><strong>${t("Android / คอมพิวเตอร์")}</strong><br>${t("เปิดด้วย Chrome หรือ Edge → เมนู → ติดตั้งแอป / เพิ่มไปยังหน้าจอหลัก")}</p><p style="margin-top:16px">${t("เปิดออนไลน์ครั้งแรกให้เรียบร้อยก่อนใช้ออฟไลน์ การรองรับขึ้นอยู่กับเบราว์เซอร์ และข้อมูลในแอปที่ติดตั้งอาจแยกจากแท็บเดิม จึงควร Export ไว้ก่อนย้าย")}</p></div><div class="form-actions">${btn(t("เข้าใจแล้ว"),'close-modal')}</div>`);}
 function resetDialog(){showDialog(t("ล้างข้อมูลทั้งหมด?"),`<p class="muted">${t("ข้อมูลฟาสติ้ง น้ำดื่ม น้ำหนัก การนอน และโปรไฟล์ในเบราว์เซอร์นี้จะถูกลบ ควรสำรองก่อนดำเนินการ")}</p><div style="margin:20px 0">${btn(t("ส่งออกไฟล์สำรองก่อน"),'export','down','secondary')}</div><form id="resetForm">${field(t("พิมพ์ RESET เพื่อยืนยัน"),'confirmation','text','','required autocomplete="off" pattern="RESET"')}<div class="form-actions"><button type="button" class="btn secondary" data-action="close-modal">${t("ยกเลิก")}</button><button type="submit" class="btn danger">${t("ยืนยันล้างข้อมูล")}</button></div></form>`);}
 function importDialog(){const s=pendingImport;if(!s)return;const counts=[[t("ฟาสติ้ง"),s.fasts.length],[t("น้ำดื่ม"),s.water.length],[t("น้ำหนัก"),s.weights.length],[t("การนอน"),s.sleeps.length]];showDialog(t("ตรวจไฟล์สำรองก่อนนำเข้า"),`<p class="muted">${t("ไฟล์ iFasting v")}${s.schemaVersion} · ${esc(s.profile?.name||t("ยังไม่มีโปรไฟล์"))}</p><div style="margin:16px 0">${counts.map(([a,b])=>`<div class="history-row"><small>${a}</small><span>${b}${t(" รายการ")}</span></div>`).join('')}</div><div class="notice">${t("รวมข้อมูล: ใช้โปรไฟล์และรอบที่กำลังทำอยู่ในเครื่องนี้ รายการ ID เดียวกันใช้ฉบับที่แก้ไขล่าสุด")}<br>${t("แทนที่: ใช้ข้อมูลจากไฟล์ทั้งหมด รวมรอบที่ยังไม่จบ")}</div><label class="check-label"><input id="importConsent" type="checkbox">${t("ฉันเข้าใจว่าข้อมูลจะถูกเปลี่ยน และยอมรับรายละเอียดการใช้แอปและความเป็นส่วนตัวในหน้านี้")}</label><p class="card-note">${t("ข้อมูลสุขภาพอยู่ในเครื่อง ไม่มีการส่งไปเซิร์ฟเวอร์ ข้อมูลเฟสเป็นความรู้ทั่วไป แอปไม่ใช่เครื่องมือแพทย์ ควรสำรองข้อมูลก่อนเปลี่ยนหรือล้างข้อมูลเว็บไซต์")}</p><div class="form-actions">${state.onboarded?btn(t("สำรองปัจจุบัน"),'export','down','secondary'):''}${btn(t("รวมข้อมูล"),'import-merge','','secondary')}${btn(t("แทนที่ทั้งหมด"),'import-replace')}</div>`);}
 // Controllers: delegated events keep navigation and persisted mutations separate.
 document.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;try{
  if(el.dataset.page){page=el.dataset.page;render();window.scrollTo({top:0,behavior:'instant'});return;}
  if(el.dataset.water){await addWater(Number(el.dataset.water));return;}
  if(el.dataset.amount){waterAmount=Number(el.dataset.amount);render();return;}
  if(el.dataset.period){period=Number(el.dataset.period);render();return;}
  if(el.dataset.themeChoice){await commit(s=>s.settings.theme=el.dataset.themeChoice);return;}
  if(el.dataset.edit){showRecordForm(el.dataset.edit,el.dataset.id);return;}
  const a=el.dataset.action;if(!a)return;
  if(a==='close-modal'){modal.close();return;}if(a==='close-toast'){$('#toast').hidden=true;return;}
  if(a==='undo'){if(!undoJob||Date.now()>undoJob.expires)throw Error(t("หมดเวลาเลิกทำแล้ว"));const job=undoJob;undoJob=null;await job.run();toast(t("เลิกทำแล้ว"));return;}
  if(a==='choose-th'||a==='choose-en'){await commit(s=>s.settings.language=a==='choose-en'?'en':'th');return;}
  if(a==='upload-avatar'){avatarForm=el.closest('form');$('#avatarFile').value='';$('#avatarFile').click();return;}
  if(a==='remove-avatar'){const form=el.closest('form');form.elements.avatar.value='';updatePhotoPreview(form);return;}
  if(a==='onboard-next'){onboardingStep=1;render();return;}
  if(a==='suggest-water'){const f=el.closest('form'),kg=Number(f.elements.weight.value);f.elements.waterGoal.value=Math.max(250,Math.min(6000,Math.round(kg*30/50)*50));return;}
  if(a==='profile'){showDialog(t("ข้อมูลและเป้าหมาย"),`<form id="profileForm" data-initial-weight="${C.currentWeight(state)}" data-profile-snapshot="${esc(JSON.stringify(state.profile))}">${profileFields()}${actions()}</form>`);return;}
  if(a==='start-fast'||a==='bed'||a==='wake'){activeTimeForm(a);return;}
  if(a==='stop-confirm'){showDialog(t("หยุดฟาสติ้งรอบนี้?"),`<p class="muted">${t("บันทึกเวลาจบตอนนี้ เลิกทำได้ภายใน 30 วินาที")}</p><div class="form-actions">${btn(t("ทำต่อ"),'close-modal','','secondary')}${btn(t("ยืนยันหยุด"),'stop-fast','fast')}</div>`);return;}
  if(a==='stop-fast'){el.disabled=true;await stopFast();return;}
  if(a==='snooze'){const c=checkinType();if(c)await commit(s=>s.checkins[c.key]=now());toast(t("ไว้บันทึกเมื่อพร้อมได้ในหน้าการนอน"));return;}
  if(a==='add-water'){el.disabled=true;try{await addWater(waterAmount);}finally{el.disabled=false;}return;}
  if(a==='water-form'||a==='weight-form'||a==='sleep-form'){showRecordForm(a==='water-form'?'water':a==='weight-form'?'weights':'sleeps');return;}
  if(a==='delete-record'){const f=el.closest('form'),kind=f.dataset.kind,r=state[kind].find(x=>x.id===f.dataset.recordId);if(!r)throw Error(t("ไม่พบรายการ"));showDialog(t("ลบรายการนี้?"),`<p class="muted">${t("ลบแล้วสามารถเลิกทำได้ภายใน 30 วินาที")}</p><div class="form-actions">${btn(t("ยกเลิก"),'close-modal','','secondary')}<button class="btn danger" data-action="confirm-delete" data-kind="${kind}" data-id="${esc(r.id)}" data-updated-at="${esc(r.updatedAt)}">${t("ยืนยันลบ")}</button></div>`);return;}
  if(a==='confirm-delete'){const kind=el.dataset.kind,r=state[kind].find(x=>x.id===el.dataset.id);if(!r)throw Error(t("รายการนี้ถูกลบแล้ว"));await commit(s=>{C.assertUnchanged(s[kind],r.id,el.dataset.updatedAt);s[kind]=s[kind].filter(x=>x.id!==r.id);});modal.close();toast(t("ลบรายการแล้ว"),async()=>{await commit(s=>{if(!s[kind].some(x=>x.id===r.id))s[kind].push(r);});});return;}
  if(a==='export'){exportData();return;}if(a==='import'){$('#importFile').value='';$('#importFile').click();return;}
  if(a==='import-merge'||a==='import-replace'){if(!$('#importConsent').checked)throw Error(t("กรุณายืนยันก่อนนำเข้าข้อมูล"));if(!pendingImport)throw Error(t("กรุณาเลือกไฟล์ใหม่"));const imported=pendingImport;await commit(s=>{const language=s.settings.language;const result=a==='import-merge'?C.merge(s,imported):C.validateBackup(imported);if(!result.settings.language)result.settings.language=language;Object.assign(s,result);if(s.profile){s.onboarded=true;s.consentVersion=1;}});pendingImport=null;page='home';modal.close();render();window.scrollTo({top:0,behavior:'instant'});toast(t("นำเข้าข้อมูลแล้ว"));return;}
  if(a==='reset'){resetDialog();return;}if(a==='share'){await share();return;}if(a==='install'){await install();return;}
 }catch(err){fail(err);if(el.isConnected)el.disabled=false;}});
 document.addEventListener('input',e=>{if(e.target.id==='waterSlider'){waterAmount=Number(e.target.value);$('#amountOutput').textContent=waterAmount;const b=$('[data-action="add-water"]');b.innerHTML=icon('plus')+t("บันทึกน้ำ ")+waterAmount+' ml';} });
 document.addEventListener('change',async e=>{if(e.target.id==='stopSlide'){try{if(Number(e.target.value)>=95)await stopFast();else e.target.value=0;}catch(err){e.target.value=0;fail(err);}}});
 document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(photoTasks.has(f)){fail(Error(t("กำลังย่อรูป กรุณารอสักครู่")));return;}const submit=f.querySelector('button[type="submit"]');if(submit)submit.disabled=true;try{
  if(f.id==='onboardingForm'){const p=readProfile(f);if(!f.elements.consent.checked)throw Error(t("กรุณาอ่านและยอมรับรายละเอียด"));const stamp=now();await commit(s=>{s.profile=p;s.onboarded=true;s.consentVersion=1;s.weights.push({id:id(),kg:p.weight,at:stamp,updatedAt:stamp});});window.scrollTo({top:0,behavior:'instant'});toast(t("ยินดีต้อนรับสู่จังหวะใหม่ของคุณ"));}
  else if(f.id==='profileForm'){const p=readProfile(f);await commit(s=>{if(JSON.stringify(s.profile)!==f.dataset.profileSnapshot)throw Error(t("ข้อมูลตั้งค่าเปลี่ยนจากอีกหน้าต่างแล้ว กรุณาเปิดใหม่"));C.updateProfile(s,p,Number(f.dataset.initialWeight),{id:id(),at:now()});});modal.close();toast(t("บันทึกการตั้งค่าแล้ว"));}
  else if(f.id==='activeForm'){const type=f.dataset.type,at=toISO(f.elements.at.value),stamp=now();await commit(s=>{if(type==='wake'){if(!s.activeSleep||s.activeSleep.id!==f.dataset.activeId)throw Error(t("สถานะการนอนเปลี่ยนแล้ว"));C.sleepHours(s.activeSleep.start,at);s.sleeps.push({...s.activeSleep,end:at,updatedAt:stamp});s.activeSleep=null;s.checkins['wake-'+C.dayKey()]=stamp;}else if(type==='bed'){if(s.activeSleep)throw Error(t("กำลังบันทึกการนอนอยู่แล้ว"));s.activeSleep={id:id(),start:at};s.checkins['bed-'+C.dayKey()]=stamp;}else{if(s.activeFast)throw Error(t("มีรอบฟาสติ้งอยู่แล้ว"));s.activeFast={id:id(),start:at};}});modal.close();toast(type==='wake'?t("อรุณสวัสดิ์ บันทึกเวลาตื่นแล้ว"):type==='bed'?t("พักผ่อนให้เต็มที่นะ"):t("เริ่มจับเวลาแล้ว ปิดแอปแล้วกลับมาดูต่อได้"));}
  else if(f.id==='recordForm'){const kind=f.dataset.kind,recordId=f.dataset.recordId,stamp=now();let record={id:recordId||id(),updatedAt:stamp};if(kind==='water'||kind==='weights'){const key=kind==='water'?'ml':'kg';record[key]=Number(f.elements[key].value);record.at=toISO(f.elements.at.value);}else{record.start=toISO(f.elements.start.value);record.end=toISO(f.elements.end.value);C.sleepHours(record.start,record.end);}await commit(s=>{if(recordId)C.assertUnchanged(s[kind],recordId,f.dataset.updatedAt);s[kind]=s[kind].filter(x=>x.id!==record.id);s[kind].push(record);});modal.close();toast(t("บันทึกข้อมูลแล้ว"));}
  else if(f.id==='resetForm'){if(f.elements.confirmation.value!=='RESET')throw Error(t("พิมพ์ RESET เพื่อยืนยัน"));await commit(s=>Object.assign(s,C.empty()));onboardingStep=0;page='home';undoJob=null;modal.close();render();toast(t("ล้างข้อมูลแล้ว เริ่มต้นใหม่ได้เลย"));}
 }catch(err){fail(err);}finally{if(submit?.isConnected)submit.disabled=false;}});
 $('#importFile').addEventListener('change',async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>20*1024*1024)throw Error(t("ไฟล์ใหญ่เกิน 20 MB"));pendingImport=C.validateBackup(JSON.parse(await file.text()));importDialog();}catch(err){pendingImport=null;fail(err);}});
 modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;});
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
 document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('paused',document.hidden);if(!document.hidden){refresh();updateLive();}});
 let lastDay=C.dayKey();
 async function refresh(){if(!booted||pollBusy||document.hidden||storageProblem)return;pollBusy=true;try{const fresh=await Storage.read(),day=C.dayKey();if(fresh.revision!==state.revision||day!==lastDay){state=fresh;lastDay=day;applyTheme();render();}}catch(e){storageProblem=true;$('#statusBanner').innerHTML=t("<div class=\"notice error\">อ่านข้อมูลไม่สำเร็จ กรุณาโหลดใหม่ ข้อมูลเดิมยังไม่ถูกเขียนทับ</div>");}finally{pollBusy=false;}}
 setInterval(updateLive,1000);setInterval(refresh,5000);
 async function boot(){try{await Storage.open();state=await Storage.read();booted=true;applyTheme();render();$('#splash').remove();if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{const status=$('#offlineStatus');if(status)status.textContent=t("บันทึกแอปสำหรับเปิดออฟไลน์แล้ว");}).catch(()=>{const status=$('#offlineStatus');if(status)status.textContent=t("ยังไม่พร้อมออฟไลน์ · ตรวจไฟล์ sw.js");});}}catch(e){$('#splash').remove();root.innerHTML=`<div class="fatal card"><h1>${t("ยังเปิดข้อมูลไม่ได้")}</h1><p class="notice error">${esc(e.message)}</p><p class="card-note">${t("ข้อมูลเดิมยังไม่ถูกลบหรือเขียนทับ ลองเปิดผ่าน Safari / Chrome ปกติ อนุญาตพื้นที่เก็บข้อมูล แล้วโหลดใหม่ หากเปิดไฟล์โดยตรง แนะนำใช้ลิงก์ GitHub Pages หรือ localhost")}</p><button class="btn" style="margin-top:20px" onclick="location.reload()">${t("ลองใหม่")}</button></div>`;}}
 boot();
})();
